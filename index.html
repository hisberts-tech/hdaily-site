<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>H-Daily Admin | Tableau de bord</title>
    <meta name="description" content="Panneau d'administration H-Daily - Gestion des produits, commandes et abonnements" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js pour analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #FDF9F2; } /* Website cream background */
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        /* Website-hdaily color scheme: Primary green (#10b981), Secondary dark (#1F2A2E), Cream (#FDF9F2) */
        .h-primary { color: #10b981; }
        .h-primary-bg { background-color: #10b981; }
        .h-primary-border { border-color: #10b981; }
        .h-primary-hover:hover { color: #10b981 !important; transition: all 0.2s; }
        .admin-card { transition: all 0.2s ease; border: 1px solid #E8DFD3; } /* Website border */
        .admin-card:hover { box-shadow: 0 12px 24px -12px rgba(0,0,0,0.12); transform: translateY(-2px); }
        .sidebar-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 16px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 600; color: #2C3A3F; font-size: 14px; font-family: 'Inter', sans-serif; border: 1px solid transparent; }
        .sidebar-item:hover { background-color: #F5F0E8; color: #10b981; transform: translateX(4px); border-color: #E8DFD3; }
        .sidebar-item.active { background-color: #10b981; color: white; transform: translateX(4px); border-color: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15); }
        .sidebar-item i { font-size: 16px; width: 20px; text-align: center; }
        .btn-primary { background-color: #10b981; transition: 0.2s; }
        .btn-primary:hover { background-color: #059669; transform: translateY(-1px); }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 100px; font-size: 0.7rem; font-weight: 600; }
        /* Modals animations */
        .modal-transition { transition: opacity 0.2s ease; }
    </style>
</head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
